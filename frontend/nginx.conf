worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Configuración del servidor principal
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ==== RUTAS ESTÁTICAS PRINCIPALES ====
        
        # Página principal
        location = / {
            try_files /index.html =404;
        }
        
        # Sección de muebles/trabajos
        location /muebles {
            try_files /muebles.html /seccion_muebles/muebles.html =404;
        }
        
        # Preguntas frecuentes
        location /preguntas-frecuentes {
            try_files $uri $uri/ /preguntas_frecuentes/pfrecuentes.html;
        }
        
        # ==== RUTAS DE AUTENTICACIÓN (HTML ESTÁTICO) ====
        
        location /login {
            try_files /app/pages/sesion_login.html =404;
        }
        
        location /register {
            try_files /app/pages/sesion.html =404;
        }
        
        location /perfil {
            try_files /app/pages/perfil.html =404;
        }
        
        # ==== RUTAS DE PRODUCTOS INDIVIDUALES ====
        
        # Barra
        location /barra {
            try_files /muebles/barra/barra.html =404;
        }
        
        # Mesas de comedor (todas van a barra por ahora según tu config original)
        location ~ ^/mesa-comedor-[1-4]$ {
            try_files /muebles/barra/barra.html =404;
        }
        
        # Escritorios
        location /escritorio-moderno {
            try_files /muebles/escritorio_moderno/escritorio_moderno.html =404;
        }
        
        location /escritorio-ejecutivo {
            try_files /muebles/escritorio_ejecutivo/escritorio_ejecutivo.html =404;
        }
        
        location ~ ^/escritorio-(minimalista|industrial|vintage|compacto)$ {
            try_files /muebles/barra/barra.html =404;
        }
        
        # Mesas ratonas con páginas específicas
        location /mesa-ratona-moderna {
            try_files /muebles/mesa_ratona_moderna/mesa_ratona_moderna.html =404;
        }
        
        location /mesa-ratona-blanca {
            try_files /muebles/mesa_ratona_blanca/mesa_ratona_blanca.html =404;
        }
        
        location /mesa-ratona-vidrio {
            try_files /muebles/mesa_ratona_vidrio/mesa_ratona_vidrio.html =404;
        }
        
        location /mesa-ratona-mueble {
            try_files /muebles/mesa_ratona_mueble/mesa_ratona_mueble.html =404;
        }
        
        location /mesa-ratona-sillas {
            try_files /muebles/mesa_ratona_sillas/mesa_ratona_sillas.html =404;
        }
        
        location /estanteria-moderna {
            try_files /muebles/estanteria_moderna/estanteria_moderna.html =404;
        }
        
        # ==== PROXY A BACKEND PARA APIS ====
        
        location /api/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ==== ARCHIVOS ESTÁTICOS ====
        
        # Imágenes
        location /imagenes_RM/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # CSS y JS - Buscar en múltiples ubicaciones
        location ~* \.(css|js)$ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri /app/public$uri =404;
        }
        
        # Otros archivos estáticos
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # Archivos HTML generales
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        
        # Manejo de archivos no encontrados
        location ~ /\. {
            deny all;
        }
        
        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
        }
        
        location = /50x.html {
            internal;
        }
    }
}